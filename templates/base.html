
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Smart Hostel{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Main navigation">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-mark" aria-hidden="true">H</span>
                <span>Hostel<span class="brand-light">Ease</span></span>
            </a>

            <p class="sidebar-label">Workspace</p>
            <nav class="side-nav">
                <a class="nav-link" href="{% url 'admin:index' %}">
                    <span class="nav-icon" aria-hidden="true">⌂</span>Dashboard
                </a>
                <a class="nav-link" href="{% url 'admin:hostel_student_changelist' %}">
                    <span class="nav-icon" aria-hidden="true">♙</span>Students
                </a>
                <a class="nav-link" href="{% url 'admin:hostel_room_changelist' %}">
                    <span class="nav-icon" aria-hidden="true">▦</span>Rooms
                </a>
                <a class="nav-link" href="{% url 'admin:hostel_feepayment_changelist' %}">
                    <span class="nav-icon" aria-hidden="true">◇</span>Fees
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="admin-avatar" aria-hidden="true">A</div>
                <div class="admin-info">
                    <strong>Administrator</strong>
                    <span>Hostel manager</span>
                </div>
                <a class="logout-link" href="{% url 'admin:logout' %}" aria-label="Log out" title="Log out">↗</a>
            </div>
        </aside>

        <div class="workspace">
            <header class="topbar">
                <button class="icon-button mobile-menu-button" type="button" id="sidebarToggle"
                        aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
                    <span aria-hidden="true">☰</span>
                </button>
                <div class="topbar-context">
                    <span class="eyebrow">SMART HOSTEL MANAGEMENT</span>
                    <h1>{% block page_heading %}Dashboard{% endblock %}</h1>
                </div>
                <div class="topbar-actions">
                    <span class="today-label">{% now "D, d M Y" %}</span>
                    <button class="icon-button theme-toggle" type="button" id="themeToggle"
                            aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
                        <span aria-hidden="true">◐</span>
                    </button>
                </div>
            </header>
            <main class="page-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
